<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Center Base-style mark -->
  <g transform="translate(512 512)">
    <rect x="-280" y="-280" width="560" height="560" rx="40" fill="none" stroke="#0000ff" stroke-width="6" opacity="0.2"/>
    <rect x="-200" y="-200" width="400" height="400" rx="28" fill="none" stroke="#0000ff" stroke-width="4" opacity="0.4"/>
    <rect x="-120" y="-120" width="240" height="240" rx="16" fill="#0000ff"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="100" font-weight="800">B20</text>
  </g>

  <!-- Top label -->
  <text x="512" y="120" text-anchor="middle" fill="#0000ff" font-family="JetBrains Mono, monospace" font-size="24" letter-spacing="6" font-weight="700">SOCIETY</text>

  <!-- Bottom label -->
  <text x="512" y="950" text-anchor="middle" fill="#9999aa" font-family="JetBrains Mono, monospace" font-size="18" letter-spacing="2" font-weight="600">AWAITING LAUNCH</text>

  <!-- Corner ticks (Base blue) -->
  <g stroke="#0000ff" stroke-width="3" opacity="0.4">
    <line x1="80" y1="80" x2="120" y2="80"/>
    <line x1="80" y1="80" x2="80" y2="120"/>
    <line x1="944" y1="80" x2="904" y2="80"/>
    <line x1="944" y1="80" x2="944" y2="120"/>
    <line x1="80" y1="944" x2="120" y2="944"/>
    <line x1="80" y1="944" x2="80" y2="904"/>
    <line x1="944" y1="944" x2="904" y2="944"/>
    <line x1="944" y1="944" x2="944" y2="904"/>
  </g>
</svg>
